spring:
  application:
    name: commentHub
  datasource:
    url: jdbc:postgresql://localhost:5432/comment_hub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    jpa:
      show-sql: true
      hibernate.ddl-auto: none
    liquibase:
      change-log: classpath:db/changelog/db.changelog-master.yaml
      enabled: true
      drop-first: false
server:
  port: 8086
